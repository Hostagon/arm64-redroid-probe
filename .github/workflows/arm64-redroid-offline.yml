name: ARM64 redroid offline probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Diagnose and enable binder
        id: binder
        shell: bash
        run: |
          uname -r
          grep -E 'BINDER|ASHMEM|MEMFD|DMABUF|PSI' /boot/config-$(uname -r) 2>&1 | head -40 || true
          zcat /proc/config.gz 2>/dev/null | grep -E 'BINDER|ASHMEM' || true
          sudo modprobe binder_linux devices=binder,hwbinder,vndbinder 2>&1 || true
          sudo modprobe ashmem_linux 2>&1 || true
          modinfo binder_linux 2>&1 | head -5 || true
          ls /lib/modules/$(uname -r)/kernel/drivers/android 2>&1 || true
          sudo mkdir -p /dev/binderfs && sudo mount -t binder binder /dev/binderfs 2>&1 || true
          ls /dev/binderfs || true
          grep -c binder /proc/filesystems || true
          if grep -qw binder /proc/filesystems && mountpoint -q /dev/binderfs; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Start isolated ARM container
        if: steps.binder.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          uname -m
          test "$(uname -m)" = aarch64
          docker pull --platform linux/arm64 redroid/redroid:15.0.0_64only-latest
          docker run -d --rm --name arm-redroid-probe --network none --privileged \
            redroid/redroid:15.0.0_64only-latest androidboot.redroid_gpu_mode=guest
          for i in $(seq 1 120); do
            if [ "$(docker exec arm-redroid-probe getprop sys.boot_completed 2>/dev/null || true)" = 1 ]; then break; fi
            sleep 5
          done
          docker exec arm-redroid-probe getprop ro.product.cpu.abilist || true
          test "$(docker exec arm-redroid-probe getprop sys.boot_completed)" = 1
      - name: Stop disposable container
        if: always()
        run: docker stop arm-redroid-probe || true
